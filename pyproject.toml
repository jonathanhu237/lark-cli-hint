[project]
name = "lark-cli-hint"
version = "0.1.0"
description = "A drop-in wrapper for lark-cli that surfaces contextual knowledge from your Feishu workspace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathan Hu", email = "huzzh33@gmail.com" }]

dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
lch = "lark_cli_hint.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lark_cli_hint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
